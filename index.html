<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06040d">
<title>MEMBERS SHOP</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% -10%,rgba(126,74,255,.28),transparent 38%),
    radial-gradient(circle at 0% 100%,rgba(90,35,220,.18),transparent 35%),
    #06040d;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background-image:
    linear-gradient(rgba(155,100,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(155,100,255,.035) 1px,transparent 1px);
  background-size:55px 55px;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:relative;
  padding:30px 20px 80px;
  text-align:center;
}

.topbar{
  width:min(1100px,100%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  color:#fff;
  font-size:22px;
  font-weight:1000;
  letter-spacing:3px;
}

.logo span{
  color:#a970ff;
}

.cartButton{
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid rgba(175,110,255,.35);
  border-radius:13px;
  padding:12px 16px;
  color:#fff;
  background:rgba(17,10,31,.85);
  transition:.25s;
}

.cartButton:hover{
  transform:translateY(-2px);
  border-color:#a970ff;
  box-shadow:0 10px 35px rgba(133,73,255,.2);
}

.cartCount{
  min-width:23px;
  height:23px;
  padding:0 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50px;
  background:#8c4cff;
  font-size:11px;
  font-weight:1000;
}

.hero{
  width:min(900px,100%);
  margin:95px auto 0;
}

.heroBadge{
  display:inline-block;
  padding:9px 16px;
  border:1px solid rgba(166,102,255,.35);
  border-radius:50px;
  color:#b985ff;
  background:rgba(130,70,255,.08);
  font-size:10px;
  font-weight:1000;
  letter-spacing:3px;
}

.hero h1{
  margin-top:25px;
  font-size:clamp(50px,10vw,100px);
  line-height:.95;
  font-weight:1000;
  letter-spacing:4px;
  background:linear-gradient(90deg,#fff,#c496ff,#8d4dff,#fff);
  background-size:250%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 5s linear infinite;
}

@keyframes shine{
  to{
    background-position:-250%;
  }
}

.hero p{
  max-width:650px;
  margin:24px auto 0;
  color:#8e879d;
  font-size:15px;
  line-height:1.7;
}

.heroButton{
  margin-top:32px;
  border:0;
  border-radius:13px;
  padding:15px 26px;
  background:linear-gradient(135deg,#9b5cff,#6e35e8);
  color:#fff;
  font-weight:1000;
  box-shadow:0 12px 40px rgba(125,63,255,.28);
  transition:.25s;
}

.heroButton:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 50px rgba(125,63,255,.4);
}

main{
  width:min(1100px,calc(100% - 30px));
  margin:auto;
  padding-bottom:100px;
}

.sectionTitle{
  margin:0 0 25px;
  color:#8c829d;
  font-size:11px;
  font-weight:1000;
  letter-spacing:3px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.product{
  position:relative;
  overflow:hidden;
  padding:27px;
  border:1px solid rgba(165,103,255,.17);
  border-radius:23px;
  background:
    linear-gradient(145deg,rgba(25,15,44,.96),rgba(9,6,18,.98));
  box-shadow:0 25px 70px rgba(0,0,0,.35);
  transition:.3s;
}

.product::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  top:-100px;
  right:-80px;
  border-radius:50%;
  background:rgba(135,73,255,.14);
  filter:blur(5px);
}

.product:hover{
  transform:translateY(-5px);
  border-color:rgba(165,103,255,.45);
  box-shadow:
    0 30px 80px rgba(0,0,0,.5),
    0 0 35px rgba(128,68,255,.1);
}

.productTop{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.productIcon{
  width:62px;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  border:1px solid rgba(175,110,255,.4);
  background:rgba(126,66,255,.1);
  font-size:28px;
}

.productNumber{
  color:#62566f;
  font-size:11px;
  font-weight:1000;
}

.product h2{
  position:relative;
  margin-top:22px;
  font-size:25px;
}

.productDescription{
  position:relative;
  min-height:50px;
  margin-top:10px;
  color:#847b91;
  font-size:13px;
  line-height:1.6;
}

.priceRow{
  position:relative;
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-top:23px;
}

.price{
  font-size:34px;
  font-weight:1000;
}

.priceSuffix{
  color:#746b82;
  font-size:12px;
}

.productActions{
  position:relative;
  display:flex;
  gap:10px;
  margin-top:23px;
}

.chooseButton{
  flex:1;
  border:0;
  border-radius:11px;
  padding:14px;
  color:#fff;
  background:linear-gradient(135deg,#9255ff,#6d35e7);
  font-size:13px;
  font-weight:1000;
  transition:.25s;
}

.chooseButton:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 35px rgba(125,63,255,.3);
}

.addDirect{
  width:48px;
  border:1px solid rgba(165,103,255,.25);
  border-radius:11px;
  color:#fff;
  background:#120b20;
  font-size:20px;
  transition:.25s;
}

.addDirect:hover{
  border-color:#a970ff;
}

.empty{
  padding:30px;
  border:1px dashed rgba(165,103,255,.2);
  border-radius:18px;
  text-align:center;
  color:#756c82;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(6px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  z-index:110;
  width:min(480px,100%);
  padding:25px;
  overflow-y:auto;
  background:
    linear-gradient(180deg,#100a1c,#07050d);
  border-left:1px solid rgba(165,103,255,.2);
  box-shadow:-25px 0 80px rgba(0,0,0,.55);
  transform:translateX(105%);
  transition:.3s;
}

.drawer.active{
  transform:translateX(0);
}

.drawerHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:25px;
}

.drawerHeader h3{
  font-size:20px;
}

.closeButton{
  width:38px;
  height:38px;
  border:1px solid rgba(165,103,255,.2);
  border-radius:10px;
  color:#fff;
  background:#120b1c;
  font-size:18px;
}

.quantityProduct{
  padding:20px;
  border:1px solid rgba(165,103,255,.16);
  border-radius:17px;
  background:rgba(18,10,31,.8);
}

.quantityProductName{
  font-size:19px;
  font-weight:1000;
}

.quantityProductPrice{
  margin-top:7px;
  color:#9d6cff;
  font-size:13px;
  font-weight:900;
}

.quantityControls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin:28px 0;
}

.quantityButton{
  width:45px;
  height:45px;
  border:1px solid rgba(165,103,255,.25);
  border-radius:12px;
  color:#fff;
  background:#120b20;
  font-size:22px;
}

.quantityValue{
  min-width:55px;
  text-align:center;
  font-size:25px;
  font-weight:1000;
}

.summary{
  display:grid;
  gap:10px;
  margin-top:20px;
}

.summaryLine{
  display:flex;
  justify-content:space-between;
  gap:15px;
  color:#8b8198;
  font-size:13px;
}

.summaryLine strong{
  color:#fff;
}

.primaryButton{
  width:100%;
  margin-top:22px;
  border:0;
  border-radius:12px;
  padding:16px;
  background:#8e50ff;
  color:#fff;
  font-weight:1000;
  transition:.25s;
}

.primaryButton:hover{
  background:#a168ff;
  transform:translateY(-2px);
}

.cartItems{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.cartItem{
  padding:17px;
  border:1px solid rgba(165,103,255,.15);
  border-radius:15px;
  background:rgba(17,9,29,.8);
}

.cartItemTop{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.cartItemName{
  font-weight:1000;
}

.cartItemQty{
  margin-top:6px;
  color:#81778e;
  font-size:12px;
}

.cartItemBottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:14px;
}

.cartItemPrice{
  color:#b27dff;
  font-weight:1000;
}

.removeButton{
  border:1px solid rgba(255,80,100,.2);
  border-radius:9px;
  padding:8px 11px;
  color:#ff8291;
  background:rgba(255,60,80,.06);
  font-size:11px;
  font-weight:900;
}

.cartTotal{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid rgba(165,103,255,.15);
  font-size:18px;
  font-weight:1000;
}

.cartTotal span:last-child{
  color:#b47fff;
}

.emailInput{
  width:100%;
  margin-top:20px;
  border:1px solid rgba(165,103,255,.2);
  border-radius:11px;
  outline:0;
  padding:13px;
  color:#fff;
  background:#0e0917;
}

.emailInput::placeholder{
  color:#675d73;
}

.paypalButton{
  width:100%;
  margin-top:15px;
  border:0;
  border-radius:12px;
  padding:16px;
  background:#ffc439;
  color:#111;
  font-weight:1000;
  transition:.25s;
}

.paypalButton:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 35px rgba(255,196,57,.2);
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:300;
  max-width:calc(100% - 30px);
  padding:13px 18px;
  border:1px solid rgba(165,103,255,.3);
  border-radius:12px;
  color:#fff;
  background:#130c20;
  box-shadow:0 15px 45px rgba(0,0,0,.5);
  transform:translate(-50%,30px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:13px;
  font-weight:800;
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

footer{
  padding:30px 20px;
  border-top:1px solid rgba(165,103,255,.1);
  text-align:center;
  color:#62596d;
  font-size:10px;
  letter-spacing:2px;
}

@media(max-width:750px){

  .products{
    grid-template-columns:1fr;
  }

  .hero{
    margin-top:70px;
  }

}

@media(max-width:500px){

  header{
    padding-left:14px;
    padding-right:14px;
  }

  main{
    width:calc(100% - 20px);
  }

  .product{
    padding:23px;
  }

  .productActions{
    flex-direction:column;
  }

  .addDirect{
    width:100%;
    height:45px;
  }

}
</style>
</head>

  <div class="topbar">
